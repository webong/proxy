name: Profile schemas
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4,<5'
      - run: python -m unittest discover -s tests/tooling -p 'test_*.py'
      - run: python scripts/sync_go_testdata.py --check
      - run: python scripts/check_profile_schemas.py
