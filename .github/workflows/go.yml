name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23.x', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false # The library currently has no external Go dependencies/go.sum.
      - run: python3 scripts/sync_go_testdata.py --check
      - run: go -C go test -race ./...
      - run: go -C go vet ./...
