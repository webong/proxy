name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # The library currently has no external Go dependencies/go.sum.
      - run: go test -race ./...
      - run: go vet ./...
